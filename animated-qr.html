<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Qissy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 30% 20%, #fdf2f0 0%, #f5e1dc 40%, #eddad4 100%);
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
  }

  .card {
    position: relative;
    width: 380px;
    padding: 48px 40px 40px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    border: 1px solid rgba(183, 110, 121, 0.15);
    box-shadow:
      0 20px 60px rgba(122, 46, 58, 0.12),
      0 4px 16px rgba(0,0,0,0.06);
    text-align: center;
    z-index: 10;
    animation: card-float 4s ease-in-out infinite;
  }

  @keyframes card-float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(0.5deg); }
  }

  .title {
    font-family: 'Great Vibes', cursive;
    font-size: 2.8rem;
    color: #7A2E3A;
    margin-bottom: 4px;
    animation: title-glow 3s ease-in-out infinite;
  }

  @keyframes title-glow {
    0%, 100% { text-shadow: 0 0 8px rgba(183, 110, 121, 0.2); }
    50% { text-shadow: 0 0 20px rgba(183, 110, 121, 0.4); }
  }

  .subtitle {
    font-size: 1rem;
    color: #b76e79;
    margin-bottom: 28px;
    font-style: italic;
    opacity: 0.8;
    letter-spacing: 0.05em;
  }

  .qr-frame {
    position: relative;
    display: inline-block;
    padding: 12px;
    background: linear-gradient(135deg, #f5e1dc, #fff, #f5e1dc);
    border-radius: 16px;
    box-shadow:
      0 8px 32px rgba(183, 110, 121, 0.15),
      inset 0 0 0 1px rgba(183, 110, 121, 0.1);
    margin-bottom: 24px;
    animation: qr-pulse 3s ease-in-out infinite;
  }

  @keyframes qr-pulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(183, 110, 121, 0.15), inset 0 0 0 1px rgba(183, 110, 121, 0.1); }
    50% { box-shadow: 0 8px 40px rgba(183, 110, 121, 0.25), inset 0 0 0 1px rgba(183, 110, 121, 0.2); }
  }

  .qr-frame img {
    display: block;
    width: 220px;
    height: 220px;
    border-radius: 8px;
  }

  /* Heart in center of QR */
  .qr-heart {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 2px 12px rgba(122, 46, 58, 0.2);
    animation: heart-beat 1.5s ease-in-out infinite;
  }

  @keyframes heart-beat {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    15% { transform: translate(-50%, -50%) scale(1.15); }
    30% { transform: translate(-50%, -50%) scale(1); }
    45% { transform: translate(-50%, -50%) scale(1.1); }
  }

  .scan-text {
    font-family: 'Great Vibes', cursive;
    font-size: 1.6rem;
    color: #7A2E3A;
    margin-bottom: 4px;
  }

  .name-text {
    font-size: 0.9rem;
    color: #b76e79;
    opacity: 0.7;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* ── Floating Hearts ─────────────── */
  .floating-hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .fh {
    position: absolute;
    font-size: 1.2rem;
    opacity: 0;
    animation: float-up linear infinite;
  }

  @keyframes float-up {
    0% {
      opacity: 0;
      transform: translateY(100vh) translateX(0) rotate(0deg) scale(0.5);
    }
    10% { opacity: 0.7; }
    90% { opacity: 0.5; }
    100% {
      opacity: 0;
      transform: translateY(-10vh) translateX(var(--drift)) rotate(360deg) scale(1.2);
    }
  }

  /* ── Sparkles ────────────────────── */
  .sparkle {
    position: fixed;
    width: 4px;
    height: 4px;
    background: radial-gradient(circle, #d4a574, transparent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    animation: sparkle-twinkle 2s ease-in-out infinite;
  }

  @keyframes sparkle-twinkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50% { opacity: 1; transform: scale(1); }
  }

  /* ── Rose petals ─────────────────── */
  .petal {
    position: fixed;
    font-size: 1rem;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    animation: petal-fall linear infinite;
  }

  @keyframes petal-fall {
    0% {
      opacity: 0;
      transform: translateY(-5vh) translateX(0) rotate(0deg);
    }
    10% { opacity: 0.6; }
    90% { opacity: 0.3; }
    100% {
      opacity: 0;
      transform: translateY(105vh) translateX(var(--drift)) rotate(720deg);
    }
  }
</style>
</head>
<body>

</div>

<div class="floating-hearts" id="hearts"></div>

<script>
  const heartEmojis = ['💕', '💗', '💖', '🤍', '🌸', '✨', '💝'];
  const petalEmojis = ['🌸', '🪻', '🩷'];
  const heartsContainer = document.getElementById('hearts');

  // Floating hearts
  for (let i = 0; i < 20; i++) {
    const el = document.createElement('span');
    el.className = 'fh';
    el.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
    el.style.animationDuration = (6 + Math.random() * 8) + 's';
    el.style.animationDelay = (Math.random() * 10) + 's';
    el.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
    heartsContainer.appendChild(el);
  }

  // Falling petals
  for (let i = 0; i < 10; i++) {
    const el = document.createElement('span');
    el.className = 'petal';
    el.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.animationDuration = (8 + Math.random() * 6) + 's';
    el.style.animationDelay = (Math.random() * 12) + 's';
    el.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
    document.body.appendChild(el);
  }

  // Sparkles
  for (let i = 0; i < 15; i++) {
    const el = document.createElement('div');
    el.className = 'sparkle';
    el.style.left = Math.random() * 100 + '%';
    el.style.top = Math.random() * 100 + '%';
    el.style.width = el.style.height = (3 + Math.random() * 4) + 'px';
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 3) + 's';
    el.style.background = `radial-gradient(circle, ${['#d4a574','#b76e79','#e8c4b8','#f0d5c8'][Math.floor(Math.random()*4)]}, transparent)`;
    document.body.appendChild(el);
  }
</script>
