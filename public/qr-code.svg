<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -80 520 560" width="520" height="560">
  <defs>
    <!-- Soft shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7A2E3A" flood-opacity="0.15"/>
    </filter>
    <!-- Paper texture -->
    <pattern id="paper" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="#FDF6EE"/>
      <rect width="1" height="1" x="1" y="1" fill="#D4848A" opacity="0.03"/>
      <rect width="1" height="1" x="3" y="3" fill="#D4848A" opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Card background -->
  <rect x="-50" y="-70" width="500" height="540" rx="24" ry="24"
        fill="url(#paper)" stroke="#D4848A" stroke-width="1.5"
        filter="url(#shadow)" opacity="0.97"/>

  <!-- Decorative top border -->
  <line x1="-20" y1="-35" x2="420" y2="-35"
        stroke="#D4848A" stroke-width="0.5" opacity="0.3"/>

  <!-- Title -->
  <text x="200" y="-42" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="16" fill="#7A2E3A" font-weight="600"
        letter-spacing="0.08em">
    SCAN FOR A LITTLE SURPRISE
  </text>

